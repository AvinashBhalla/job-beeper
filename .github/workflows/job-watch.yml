name: job-watch
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write

# Never allow an old polling run to overwrite a newer run/code change.
concurrency:
  group: job-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - run: python job_watch.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PLAYWRIGHT_JD_FALLBACK: "true"
          PLAYWRIGHT_JD_LIMIT: "25"
          PLAYWRIGHT_HEADLESS: "true"

      - name: Save state and dashboard feed
        run: |
          git config user.name "job-watch-bot"
          git config user.email "bot@users.noreply.github.com"

          # The source code/config may have changed while this run was polling.
          # Rebase our generated state onto the latest main before pushing.
          git add seen.json source_state.json jd_cache.json dashboard/data/jobs.json
          git diff --staged --quiet && exit 0

          git commit -m "refresh job feed"
          git pull --rebase origin main
          git push
