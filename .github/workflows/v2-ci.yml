name: V2 CI

on:
  push:
    branches:
      - v2-live-radar
  pull_request:
    branches:
      - v2-live-radar

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r v2/requirements.txt
      - run: python -m py_compile v2/radar.py v2/test_radar.py
      - run: python -m unittest discover -s v2 -p 'test_*.py' -v
