name: V2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-live-radar
  pull_request:
    branches:
      - main
      - v2-live-radar

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r v2/requirements-dev.txt
      - run: python -m py_compile v2/auth.py v2/auth_admin.py v2/radar.py v2/test_auth.py v2/test_dashboard_auth_contract.py v2/test_radar.py v2/greenhouse_canary.py v2/test_greenhouse_canary.py
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/auth.js && node --check dashboard/app.js
      - name: Run focused router and extractor tests
        run: python -m unittest v2.test_llm_router v2.test_gemini_extractor -v
      - name: Run full V2 unittest suite
        run: python -m unittest discover -s v2 -p 'test_*.py' -v
