name: check-sources
on:
  workflow_dispatch:
    inputs:
      prune:
        description: "Remove dead company slugs from config.json"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python check_sources.py ${{ inputs.prune && '--prune' || '' }}
      - name: Commit pruned config
        run: |
          git config user.name "job-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config.json
          git diff --staged --quiet || (git commit -m "prune dead sources" && git push)
