services:
  radar:
    image: job-radar-prod-release:gmail-20261122
    build:
      context: ..
      dockerfile: v2/Dockerfile
    restart: unless-stopped
    # Preserve production's loopback-only listener and existing data volume.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - radar-data:/data
    environment:
      JOB_RADAR_DB: /data/jobs.db
      # Preserve current authentication origin/cookie behaviour from the private env.
      JOB_BEEPER_COOKIE_SECURE: ${JOB_BEEPER_COOKIE_SECURE:-true}
      JOB_BEEPER_PUBLIC_ORIGIN: ${JOB_BEEPER_PUBLIC_ORIGIN:-}
      JOB_RADAR_TELEGRAM_BOT_TOKEN: ${JOB_RADAR_TELEGRAM_BOT_TOKEN:-}
      JOB_RADAR_TELEGRAM_CHAT_ID: ${JOB_RADAR_TELEGRAM_CHAT_ID:-}
      JOB_BEEPER_TELEGRAM_BOT_USERNAME: ${JOB_BEEPER_TELEGRAM_BOT_USERNAME:-}
      JOB_BEEPER_TELEGRAM_WEBHOOK_SECRET: ${JOB_BEEPER_TELEGRAM_WEBHOOK_SECRET:-}
      # Personal owner-only Google Alerts Gmail integration. Polling is the default;
      # live mailbox access remains explicitly disabled unless set in the private env file.
      JOB_RADAR_GMAIL_OAUTH_CLIENT_ID: ${JOB_RADAR_GMAIL_OAUTH_CLIENT_ID:-}
      JOB_RADAR_GMAIL_OAUTH_CLIENT_SECRET: ${JOB_RADAR_GMAIL_OAUTH_CLIENT_SECRET:-}
      JOB_RADAR_GMAIL_OAUTH_REDIRECT_URI: ${JOB_RADAR_GMAIL_OAUTH_REDIRECT_URI:-http://localhost:8080/api/integrations/google-alerts/gmail/callback}
      JOB_RADAR_GMAIL_OWNER_USER_ID: ${JOB_RADAR_GMAIL_OWNER_USER_ID:-}
      JOB_RADAR_GMAIL_OWNER_EMAIL: ${JOB_RADAR_GMAIL_OWNER_EMAIL:-}
      JOB_RADAR_GMAIL_TOKEN_ENCRYPTION_KEY: ${JOB_RADAR_GMAIL_TOKEN_ENCRYPTION_KEY:-}
      JOB_RADAR_GMAIL_SYNC_MODE: ${JOB_RADAR_GMAIL_SYNC_MODE:-polling}
      JOB_RADAR_GMAIL_POLL_INTERVAL_SECONDS: ${JOB_RADAR_GMAIL_POLL_INTERVAL_SECONDS:-180}
      JOB_RADAR_GMAIL_ENABLE_LIVE_ACCESS: ${JOB_RADAR_GMAIL_ENABLE_LIVE_ACCESS:-false}

volumes:
  radar-data:
    external: true
    name: v2_radar-data
