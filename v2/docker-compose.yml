services:
  radar:
    build:
      context: ..
      dockerfile: v2/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - radar-data:/data
    environment:
      JOB_RADAR_DB: /data/jobs.db
      JOB_RADAR_TELEGRAM_BOT_TOKEN: ${JOB_RADAR_TELEGRAM_BOT_TOKEN:-}
      JOB_RADAR_TELEGRAM_CHAT_ID: ${JOB_RADAR_TELEGRAM_CHAT_ID:-}
      JOB_RADAR_GITHUB_READ_TOKEN: ${JOB_RADAR_GITHUB_READ_TOKEN:-}

volumes:
  radar-data:
