# Isolated development instance.
# Run with: docker compose -p job-radar-dev -f v2/docker-compose.dev.yml up -d --build
# Port is loopback-only; use an SSH tunnel to open the dashboard.
services:
  radar:
    build:
      context: ..
      dockerfile: v2/Dockerfile
    container_name: job-radar-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - radar-dev-data:/data
      - ./config.dev.json:/app/v2/config.json:ro
    environment:
      JOB_RADAR_DB: /data/jobs.db
      # This service is loopback-only and used through an SSH tunnel; production stays Secure=true.
      JOB_BEEPER_COOKIE_SECURE: ${JOB_BEEPER_COOKIE_SECURE:-false}
      # Set this only when the dashboard is accessed through a different public TLS origin.
      JOB_BEEPER_PUBLIC_ORIGIN: ${JOB_BEEPER_PUBLIC_ORIGIN:-}
      # Deliberately blank: development must never Telegram-alert users.
      JOB_RADAR_TELEGRAM_BOT_TOKEN: ""
      JOB_RADAR_TELEGRAM_CHAT_ID: ""
      LOG_LEVEL: INFO
      # Shadow-only Gemini JD extraction; never changes match decisions or alerts.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EXTRACTION_ENABLED: ${GEMINI_EXTRACTION_ENABLED:-false}
      GEMINI_MATCHER_ENABLED: ${GEMINI_MATCHER_ENABLED:-false}
      GEMINI_MAX_CALLS_PER_RUN: ${GEMINI_MAX_CALLS_PER_RUN:-3}
      GEMINI_MAX_CALLS_PER_DAY: ${GEMINI_MAX_CALLS_PER_DAY:-20}
      # Optional multi-provider router; disabled until explicitly enabled in the VM .env.
      LLM_ROUTER_ENABLED: ${LLM_ROUTER_ENABLED:-false}
      # Keep alternate-provider results out of hard matching until explicitly validated.
      LLM_ROUTER_MATCHER_ENABLED: ${LLM_ROUTER_MATCHER_ENABLED:-false}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-groq,gemini,openrouter,nvidia}
      LLM_MAX_JOBS_PER_RUN: ${LLM_MAX_JOBS_PER_RUN:-3}
      LLM_MAX_JOBS_PER_DAY: ${LLM_MAX_JOBS_PER_DAY:-20}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}

volumes:
  radar-dev-data:
