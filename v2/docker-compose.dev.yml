# Isolated development instance.
# Run with: docker compose -p job-radar-dev -f v2/docker-compose.dev.yml up -d --build
# Port is loopback-only; use an SSH tunnel to open the dashboard.
services:
  radar:
    build:
      context: ..
      dockerfile: v2/Dockerfile
    container_name: job-radar-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - radar-dev-data:/data
      - ./config.dev.json:/app/v2/config.json:ro
    environment:
      JOB_RADAR_DB: /data/jobs.db
      # Deliberately blank: development must never Telegram-alert users.
      JOB_RADAR_TELEGRAM_BOT_TOKEN: ""
      JOB_RADAR_TELEGRAM_CHAT_ID: ""
      LOG_LEVEL: INFO
      # Shadow-only Gemini JD extraction; never changes match decisions or alerts.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EXTRACTION_ENABLED: ${GEMINI_EXTRACTION_ENABLED:-false}
      GEMINI_MAX_CALLS_PER_RUN: ${GEMINI_MAX_CALLS_PER_RUN:-3}
      GEMINI_MAX_CALLS_PER_DAY: ${GEMINI_MAX_CALLS_PER_DAY:-20}

volumes:
  radar-dev-data:
